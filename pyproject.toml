[project]
name = "dexm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Run Zhang", email = "runzhang715@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "newton[examples]>=1.5.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
dexm = "dexm:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "viser>=1.1.0",
]

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "D",    # pydocstyle (docstring conventions)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
